<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | MarketScholar</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070814;
            --card-bg: rgba(20, 23, 43, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow-1 {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, rgba(59, 130, 246, 0.08) 40%, rgba(7, 8, 20, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .navbar-custom {
            background: rgba(11, 13, 28, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
            color: #ffffff !important;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            font-size: 0.95rem;
            margin: 0 10px;
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            color: #ffffff !important;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 16px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo .brand-icon {
            color: var(--accent-purple);
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .auth-logo h1 {
            font-weight: 800;
            font-size: 1.6rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-label-custom {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control-dark {
            background: rgba(10, 12, 26, 0.8);
            border: 1px solid var(--card-border);
            color: #fff;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .form-control-dark:focus {
            background: rgba(15, 18, 38, 0.95);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        .form-control-dark::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .btn-auth {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.45);
            color: #ffffff;
        }

        .btn-auth:disabled {
            opacity: 0.65;
            transform: none;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .auth-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #c4b5fd;
        }

        .alert-auth {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            border: none;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span style="color: var(--accent-purple);">❖</span> MarketScholar
            </a>
            <div class="d-flex gap-2 ms-auto">
                <a href="/login" class="nav-link active" style="color: #ffffff !important;">Log In</a>
                <a href="/signup" class="btn btn-sm px-4 fw-600" style="background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border: none; border-radius: 9999px; font-weight: 600; padding: 8px 20px;">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Auth Form -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="brand-icon">❖</span>
                <h1>Welcome back</h1>
                <p>Log in to your MarketScholar account</p>
            </div>

            <!-- Error / Success Alert -->
            <div id="alertBox" style="display: none;" class="alert-auth mb-4"></div>

            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label-custom" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control form-control-dark"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label-custom" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control form-control-dark"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-auth mt-2" id="loginBtn">Log In</button>
            </form>

            <div class="divider">or</div>

            <div class="auth-footer">
                Don't have an account? <a href="/signup">Sign up free</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type) {
            alertBox.className = `alert-auth mb-4 alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Please fill in all fields.', 'warning');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = '/dashboard'; }, 800);
                } else {
                    showAlert(data.error || 'Invalid credentials. Please try again.', 'danger');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log In';
                }
            } catch (err) {
                showAlert('Network error. Please check your connection.', 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
